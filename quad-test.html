<!doctype html><html><body style="margin:0;background:#111">
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(600, 600); document.body.append(renderer.domElement);
const cam = new THREE.PerspectiveCamera(40, 1, .1, 100); cam.position.set(2, 2, 4); cam.lookAt(0, 0, 0);
const pos = [], col = [], idx = [];
let vi = 0;
const quad = (a, b, c, d) => { idx.push(a, b, c, b, c, d); };
const N = 4, S = 1.6;
for (let r = 0; r < N; r++) for (let q = 0; q < N; q++) {
  const x0 = q / N * S - S / 2, x1 = (q + 1) / N * S - S / 2;
  const y0 = r / N * S - S / 2, y1 = (r + 1) / N * S - S / 2;
  const k00 = vi, k01 = vi + 1, k10 = vi + 2, k11 = vi + 3;
  pos.push(x0, y0, 0, x1, y0, 0, x0, y1, 0, x1, y1, 0);
  col.push(1, 0, 0, 1, 0.2, 0.2, 0.2, 1, 0.2, 0.2, 1, 0.2);
  vi += 4;
  quad(k00, k01, k11, k10);
}
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
g.setIndex(idx);
scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })));
renderer.render(scene, cam);
window.__ok = true;
</script></body></html>
